name: Release

on:
  push:
    # Binaries are not committed: every tag builds them and attaches them to
    # its GitHub release.
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-tag:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A binary whose --version disagrees with its release is worse than no
      # release at all. Checked once, before any platform builds.
      - name: Check the crate version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$crate_version" != "${TAG#v}" ]; then
            echo "Cargo.toml is $crate_version but the tag is $TAG." >&2
            echo "Bump the version in Cargo.toml in the tagged commit." >&2
            exit 1
          fi

      # Once, here: the matrix jobs racing to create the same release would
      # leave the losers failed and their platform's assets missing.
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          range="${previous_tag:+$previous_tag..}$TAG"
          git log --no-merges --format='- %s (%h)' "$range" > notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file notes.md

  build-binaries:
    name: Build Release Binaries
    needs: release-tag
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release-tag.outputs.tag }}
